name: Debian package

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake dpkg-dev file git ca-certificates qt6-base-dev libqt6svg6 diffutils libhunspell-1.7-0 hunspell-en-us
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Package and check dependencies
        run: |
          cpack --config build/CPackConfig.cmake -B build/packages -G DEB
          cd build/packages
          set -- jatayu-lekh_*.deb
          test "$#" -eq 1
          dependencies="$(dpkg-deb -f "$1" Depends)"
          printf '%s\n' "$dependencies"
          case "$dependencies" in *webengine*) exit 1 ;; esac
          dpkg-deb -c "$1" | grep '/share/doc/jatayu-lekh/LICENSE$'
          sha256sum "$1" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jatayu-lekh-debian-amd64
          path: |
            build/packages/*.deb
            build/packages/SHA256SUMS
          if-no-files-found: error
